<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>c-flat · real raylib · wasm</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 24px;
        background: #14141e;
        color: #e6e6ee;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      canvas {
        border: 1px solid #333;
        background: #000;
      }
      #log {
        width: 640px;
        min-height: 1.5em;
        white-space: pre-wrap;
        font-family: monospace;
        color: #9ecbff;
      }
      .err {
        color: #ff6b6b;
      }
      #start {
        padding: 10px 22px;
        font: inherit;
        font-weight: 600;
        color: #14141e;
        background: #9ecbff;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      #start:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1>c-flat · real raylib · wasm</h1>
    <canvas
      id="canvas"
      width="640"
      height="480"
      oncontextmenu="event.preventDefault()"
      tabindex="-1"
    ></canvas>
    <button id="start" disabled>Loading…</button>
    <div id="log"></div>

    <script type="module">
      import { loadRaylibProgram } from "./runtime.js";

      const WASM_URL = "./__WASM_FILE__";

      const logEl = document.getElementById("log");
      const canvas = document.getElementById("canvas");
      const startBtn = document.getElementById("start");
      const log = (s) => (logEl.textContent += s);
      const fail = (msg) => {
        logEl.innerHTML += `<span class="err">${msg}</span>\n`;
        console.error(msg);
      };

      async function main() {
        let bytes;
        try {
          bytes = await (await fetch(WASM_URL)).arrayBuffer();
        } catch (e) {
          return fail("Failed to load/instantiate c-flat wasm: " + e);
        }

        let program;
        try {
          program = await loadRaylibProgram(bytes, { canvas, log });
        } catch (e) {
          return fail(e.message);
        }

        try {
          const manifestResp = await fetch("./assets.json");
          if (manifestResp.ok) {
            await program.host.preloadAssets(await manifestResp.json());
          }
        } catch (e) {
          return fail("Failed to preload assets: " + e);
        }

        startBtn.textContent = "▶ Start";
        startBtn.disabled = false;
        startBtn.addEventListener(
          "click",
          () => {
            startBtn.remove();
            canvas.focus();
            try {
              program.run();
            } catch (e) {
              fail("Trap while running main(): " + e);
            }
          },
          { once: true },
        );
      }

      main();
    </script>
  </body>
</html>
